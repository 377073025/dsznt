# 系统设置（07 号文档第 12 节）。时间均为 Asia/Shanghai。

# fake：所有外部依赖使用模拟适配器，不需要任何申请即可运行
# real：按能力开关使用真实适配器，未就绪的能力自动降级
adapter_mode: fake

timezone: Asia/Shanghai

# 不使用的能力（2026-10-28 决定）：拼多多 / 1688 开放平台不申请，全部走专用浏览器操作网页。
# 「接入状态」页把它们放到最后、不给录入按钮；改回来删掉对应项即可
unused_capabilities: [pdd_api, alibaba_api]

# 专用浏览器用哪个：edge / chrome（都用本机安装的，每个平台单独一个用户目录）
browser: edge

paths:
  data_dir: data
  db_file: data/app.db
  assets_dir: data/assets
  imports_dir: data/imports
  packages_dir: data/packages
  browser_profiles_dir: data/browser_profiles
  page_samples_dir: data/page_samples
  logs_dir: data/logs

# 模型服务商（R06）。都走 Anthropic Messages 格式，换服务商只改这里和下面的 models / model_prices，改完重启。
#   key_ref：在 Web「接入状态 → 模型服务 → 录入凭证」时填的凭证名称
#   structured_output：服务商是否支持 output_config.format；不支持时把 JSON 结构写进系统提示词
#   batch：服务商是否支持 Message Batches；不支持时 llm_batch 不生效，全部走实时调用
llm:
  provider: deepseek
  key_ref: deepseek_api_key
  base_url: https://api.deepseek.com/anthropic
  structured_output: false
  batch: false
# 改回 Anthropic：
# llm: {provider: anthropic, key_ref: anthropic_api_key, base_url: null, structured_output: true, batch: true}

# 生图服务（R11）：火山方舟 Seedream。key_ref 是「接入状态 → 生图服务 → 录入凭证」填的凭证名称；
# 现在用 Agent Plan 个人版套餐（专属 Key + /api/plan/v3，模型 doubao-seedream-5-0-pro / doubao-seedream-5.0-flash）；
# 改按量付费：base_url 换成 /api/v3，model 填「开通管理」里已开通的模型 ID。生成的图存到 assets_dir/generated
image_gen:
  provider: seedream
  key_ref: image_gen_api_key
  base_url: https://ark.cn-beijing.volces.com/api/plan/v3
  model: doubao-seedream-5-0-pro
  size: 2K

# 代码里只用角色名，模型名只在这里出现
models:
  ceo:   {model: deepseek-v4-pro, effort: high}
  main:  {model: deepseek-v4-pro, effort: medium}
  light: {model: deepseek-flash,  effort: low}
# Anthropic 时：
#   ceo: claude-opus-5-5 / high，main: claude-sonnet-5-5 / medium，light: claude-haiku-5-5 / low

# 按智能体单独指定模型（可选）。不写的智能体用代码里的默认角色。
# 键：完整名（ceo.daily）优先，其次智能体名（ceo，对它的所有环节生效）。
# 值：角色名，或 {role, model, effort} 中任意几项——先取角色的模型，再用 model / effort 覆盖。
# 新模型需要先在 model_prices 里加价格，否则启动时报错。改完重启生效。
#
# 智能体与默认角色：
#   ceo.daily / ceo.dispatch / ceo.accept / ceo.revise  → ceo
#   ceo.chat、ops.diagnose、selection.recommend、exec.copy → main
#   selection.same_product → light
agent_models:
  # ceo.chat: ceo                          # 问答也用最强模型
  # ops: {effort: high}                    # 运营智能体全部环节加大思考量
  # selection.same_product: {model: claude-sonnet-5-5, effort: low}

# 每百万 token 价格（美元），用于成本计量。DeepSeek 按高峰时段价格记（非高峰是一半），宁高勿低
model_prices:
  deepseek-v4-pro:   {input: 1.32, output: 3.96, cache_read: 0.044}
  deepseek-flash:    {input: 0.30, output: 1.20, cache_read: 0.006}
  claude-opus-5-5:   {input: 4.0, output: 20.0, cache_read: 0.40}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.20}
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01}

budget:
  usd_to_cny: 7.2
  daily_cny: 8
  monthly_cny: 200
  warn_ratio: 0.8
  # 超日预算时仍然照常执行的智能体（与拍板相关）
  critical_agents: [ceo.daily, ceo.dispatch, ceo.accept, ops.diagnose]

# Batch 调用（07 号文档 7.4 节）：半价，结果延迟返回。列出的智能体在主流程里先提交 Batch，
# worker 每 poll_minutes 查一次；超过 max_wait_minutes 未返回则改走实时调用，早报不会因此缺失
llm_batch:
  enabled: true
  agents: [ops.diagnose]
  poll_minutes: 10
  max_wait_minutes: 45

# 单独任务（07 号文档 17.7 节）：与主流程隔离的预算、并发和网页读取额度
adhoc:
  daily_cny: 2                  # 单独任务每日 LLM 预算，不占主流程预算
  max_concurrent: 1             # 单独通道同时运行数
  web_blackout: "06:00-08:30"   # 主流程采集时段，单独任务不发起网页读取，顺延到时段结束
  web_page_ratio: 0.2           # 单独任务可用的每日页数比例
  browser_wait_minutes: 10      # 平台浏览器被主流程占用时最多等待多久
  run_retention_days: 180
  step_retention_days: 30

agent_limits:
  max_turns: 6
  max_tokens_per_run: 30000
  web_repair_max_steps: 15

schedule:
  fetch_daily: "30 6 * * *"
  ops_analysis: "45 6 * * *"
  ceo_daily: "40 7 * * *"
  daily_report: "0 8 * * *"
  selection_weekly: "0 6 * * mon"
  selection_report: "30 8 * * mon"
  review_due: "0 9 * * *"
  offer_watch: "0 10 * * *"       # 在售款货源复查
  monthly_tuning: "0 9 1 * *"     # 月度调权提议
  health_check_minutes: 30
  backup: "0 3 * * *"
  system_report: "0 21 * * sun"   # 每周日晚发周度系统报告给店主
  purge_runs: "30 3 * * *"      # 按 adhoc.*_retention_days 清理运行记录

# 每日备份（07 号文档 2.2 节）：dir 建议改到另一块盘或网盘同步目录
backup:
  dir: data/backups
  keep_days: 30

timeouts:
  suggestion_expire_hours: 48
  write_confirm_expire_hours: 24
  manual_import_remind_minutes: 30   # 必须小于数据项的 deadline_minutes

feishu:
  report_chat_id: ""          # 机器人进群后自动填写
