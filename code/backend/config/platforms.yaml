# 各平台入口、域名白名单、风控关键词与限速（07 号文档 6.3、6.5 节）
# 入口地址在 POC 阶段确认后填写；脚本里只引用 urls.<key>

# login：专用浏览器登录（Web「接入状态」里打开）。check_url 未登录时会跳到含 logged_out 任一词的地址。
pdd_backend:
  domains: [mms.pinduoduo.com]
  urls: {}
  login:
    title: 拼多多商家后台
    capability: pdd_web
    url: https://mms.pinduoduo.com/login/
    check_url: https://mms.pinduoduo.com/home/
    logged_out: [/login]
  rate_limit: {min_interval_s: 30, daily_pages: 200}
  window: ["06:00", "08:00"]

pdd_front:
  domains: [mobile.yangkeduo.com]
  urls: {}
  rate_limit: {min_interval_s: 60, daily_pages: 20}
  window: ["08:00", "23:00"]

alibaba:
  domains: [1688.com, s.1688.com, detail.1688.com]
  urls: {}
  login:
    title: 1688（采集账号）
    capability: alibaba_web
    url: https://login.1688.com/member/signin.htm
    check_url: https://work.1688.com/
    logged_out: [login.taobao.com, login.1688.com, /signin]
  rate_limit: {min_interval_s: 60, max_interval_s: 180, daily_pages: 60}
  window: ["08:00", "23:00"]

# 铺货代发工具（R09）：代发助手王，是 1688 服务市场里的应用，用 1688 专用浏览器（同一个账号）打开；每天读一次状态
daifa:
  domains: [ufuwu.1688.com, page.1688.com, air.1688.com]
  urls: {}
  rate_limit: {min_interval_s: 30, max_interval_s: 90, daily_pages: 20}
  window: ["08:00", "23:00"]

# 市场数据工具（R10）：电霸拼多多版，没有开放接口，读网页；每周选品时低频读取
dianba:
  domains: [pdd.dianba6.com]
  urls: {}
  login:
    title: 电霸（市场数据）
    capability: market_tool
    url: https://pdd.dianba6.com/login
    check_url: https://pdd.dianba6.com/
    logged_out: [/login]
  rate_limit: {min_interval_s: 30, max_interval_s: 90, daily_pages: 80}
  max_data_age_days: 14   # 热词、热销数据比这更旧就不用（试用账号的热词是历史样本）
  window: ["08:00", "23:00"]

# 页面文本或 URL 出现这些词 → 风控
risk_keywords:
  captcha: [验证码, 滑块, 拖动滑块, 安全验证, 人机验证]
  blocked: [访问受限, 账号异常, 操作频繁, 安全检测, 请稍后再试]

# 网页读取层禁止点击的元素（名称或附近文本命中即拒绝）
forbidden_click_words: [提交, 保存, 发布, 删除, 确认修改, 上架, 下架, 付款, 支付, 下单, 购买, 确认收货]
