# 选品与诊断规则（04 号文档 3.4–3.5 节）。店主经 Web「规则配置」修改，每次修改留版本。

selection:
  hard_filters:
    require_dropship: true
    min_margin: 0.25
    min_profit_per_unit: 3.0
    min_ship_48h_rate: 0.95
    max_return_rate_vs_category: 1.0     # 退货率 ≤ 类目均值 × 该系数
    banned_categories: [食品, 保健品, 化妆品, 医疗器械, 母婴奶粉, 3C数码, 成人用品, 药品]
    max_weight_kg: 3.0
    max_longest_side_cm: 60
    min_supplier_years: 2
    min_stock: 200
  score_weights:          # 合计 100
    profit: 25
    demand: 20
    competition: 10
    supplier: 15
    dropship_auto: 15
    fit: 10
    assets: 5
  # 合规审查（04 号文档 H7 与「商品风险」）：先按词库拦，词库没命中再交模型看标题与图片
  compliance:
    brand_words: [香奈儿, 迪奥, 祖玛珑, Jo Malone, 野格, 无印良品, MUJI, 宜家, IKEA, 迪士尼, Disney, 漫威, 三丽鸥,
                  Hello Kitty, 哆啦A梦, 皮卡丘, 宝可梦, 小黄人, 大牌同款, 专柜正品, 原单, 高仿, 复刻]
    llm_review: true
    max_images: 3        # 交模型看图的张数（只发网络图片地址）；0 = 只看文字
  candidate_min_score: 70
  weekly_max_recommend: 5
  profit:
    platform_fee_rate: 0.006
    promotion_rate: 0.10
    after_sales_loss_rate: 0.03
    tool_fee_per_order: 0.2
  test_run:
    days: 14
    keep_min_visitors: 300
    keep_min_cvr_ratio: 0.8      # 相对店铺平均转化率
    drop_max_visitors: 100
    drop_max_cvr_ratio: 0.5
    optimize_days: 7             # 判定「优化」后，交运营智能体诊断，再观察的天数
  # 月度调权（每月 1 日）：比较留款与下架款的各维度得分率，提议调整打分权重，店主同意后生效
  monthly_tuning:
    min_samples: 6               # 有结论的测款少于这个数不调
    max_step: 3                  # 每个维度每月最多加减几分
  # 在售款货源复查（每日 10:00）
  offer_watch:
    price_rise_ratio: 0.05       # 拿货价比上次记录涨超过这个比例就告警
    max_backups: 3

ops:
  min_weekly_visitors_for_cvr: 200
  cvr_drop_alert_ratio: 0.7      # 近 7 天转化率 < 前 7 天 × 该系数 → 异常
  max_suggestions_per_report: 5
  review_window_days: 7
