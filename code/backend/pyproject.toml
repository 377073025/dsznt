[project]
name = "dsznt-backend"
version = "0.1.0"
description = "电商店铺 AI 闭环智能体 —— 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "anthropic>=1.0",
    "keyring>=25",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "lark-oapi>=1.4",
    "playwright>=1.45",  # 专用浏览器；用本机 Edge / Chrome，不需要 playwright install
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "static/*"]
